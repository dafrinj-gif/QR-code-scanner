<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner - Special Message</title>
    
    <!-- Google Fonts (Poppins & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html5-qrcode Library for Camera Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Canvas-Confetti Library for Celebration Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(21, 28, 44, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.3);
            --accent-emerald: #10b981;
            --accent-emerald-glow: rgba(16, 185, 129, 0.25);
            --accent-indigo: #6366f1;
            --danger-red: #ef4444;
            --radius-lg: 24px;
            --radius-md: 14px;
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-gold);
            filter: blur(150px);
            opacity: 0.15;
            top: -50px;
            left: -50px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Container & Glassmorphism Card */
        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: var(--transition-smooth);
        }

        /* Header Styling */
        .app-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .app-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Dynamic Section Controller */
        .view-section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition-smooth);
        }

        .view-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Buttons Styling */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            transition: var(--transition-smooth);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #d97706 100%);
            color: #0b0f19;
            box-shadow: 0 8px 20px -4px var(--accent-gold-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -2px rgba(245, 158, 11, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-emerald) 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px -4px var(--accent-emerald-glow);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -2px rgba(16, 185, 129, 0.4);
        }

        /* Camera Scanner Viewport Setup */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        #qr-reader {
            width: 100% !important;
            border: none !important;
            background: transparent !important;
        }

        #qr-reader video {
            object-fit: cover !important;
            border-radius: 18px;
        }

        /* Corner Markers & Animated Laser Line Overlay */
        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            box-sizing: border-box;
        }

        /* Animated Laser Scanning Line */
        .laser-line {
            position: absolute;
            width: 90%;
            left: 5%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            box-shadow: 0 0 12px 2px var(--accent-gold);
            animation: scanAnimation 2.2s ease-in-out infinite alternate;
            border-radius: 50%;
        }

        @keyframes scanAnimation {
            0% { top: 8%; opacity: 0.3; }
            50% { opacity: 1; }
            100% { top: 88%; opacity: 0.3; }
        }

        /* Corner Framing Indicators */
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--accent-gold);
            border-style: solid;
        }

        .corner-tl { top: 16px; left: 16px; border-width: 4px 0 0 4px; border-top-left-radius: 8px; }
        .corner-tr { top: 16px; right: 16px; border-width: 4px 4px 0 0; border-top-right-radius: 8px; }
        .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 4px 4px; border-bottom-left-radius: 8px; }
        .corner-br { bottom: 16px; right: 16px; border-width: 0 4px 4px 0; border-bottom-right-radius: 8px; }

        /* Camera Selection Dropdown */
        .camera-select-wrapper {
            margin-bottom: 20px;
            text-align: left;
        }

        .camera-select-wrapper label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .custom-select:focus {
            border-color: var(--accent-gold);
        }

        /* Celebration Screen */
        .celebration-box {
            padding: 10px 0;
        }

        .emoji-banner {
            font-size: 3rem;
            margin-bottom: 12px;
            animation: bounce 1.8s infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.08); }
        }

        .celebration-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            line-height: 1.3;
            color: #ffffff;
            text-shadow: 0 0 20px var(--accent-gold-glow);
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 20%, #fef08a 60%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-emerald);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        /* Scanned Data Preview Box */
        .data-preview-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }

        .data-preview-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-content {
            font-size: 0.95rem;
            color: #e5e7eb;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.4;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
        }

        .data-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn-sm {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn-sm:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Error/Alert Card Styling */
        .error-card {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
            color: #fca5a5;
            text-align: left;
            font-size: 0.88rem;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .error-card i {
            color: var(--danger-red);
            font-size: 1.2rem;
            margin-top: 2px;
        }

        /* Toast Message Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1f2937;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: var(--transition-smooth);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Pulsing Placeholder Icon */
        .placeholder-box {
            width: 180px;
            height: 180px;
            margin: 10px auto 30px auto;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            transition: var(--transition-smooth);
        }

        .placeholder-box i {
            font-size: 3.5rem;
            color: var(--accent-gold);
            opacity: 0.8;
            filter: drop-shadow(0 0 10px var(--accent-gold-glow));
        }

        .placeholder-box span {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Responsive Mobile Tweak */
        @media (max-width: 480px) {
            .app-container {
                padding: 24px 20px;
            }

            .celebration-title {
                font-size: 1.5rem;
            }

            .app-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Main Container Card -->
    <main class="app-container">
        
        <!-- App Header -->
        <header class="app-header">
            <h1>QR Code Scanner</h1>
            <p id="app-subtitle">Scan the QR code to reveal your special message.</p>
        </header>

        <!-- Error Notification Container -->
        <div id="error-container" style="display: none;"></div>

        <!-- 1. INITIAL VIEW STATE -->
        <section id="view-initial" class="view-section active">
            <div class="placeholder-box">
                <i class="fa-solid fa-qrcode"></i>
                <span>Ready to Scan</span>
            </div>
            <button id="btn-start" class="btn btn-primary">
                <i class="fa-solid fa-camera"></i>
                Start Scanner
            </button>
        </section>

        <!-- 2. SCANNING VIEW STATE -->
        <section id="view-scanning" class="view-section">
            <div class="camera-select-wrapper" id="camera-select-container" style="display: none;">
                <label for="camera-select"><i class="fa-solid fa-video"></i> Select Camera</label>
                <select id="camera-select" class="custom-select"></select>
            </div>

            <div class="scanner-wrapper">
                <div id="qr-reader"></div>
                <div class="scanner-overlay">
                    <div class="laser-line"></div>
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                </div>
            </div>

            <button id="btn-stop" class="btn btn-secondary">
                <i class="fa-solid fa-stop"></i>
                Stop Scanner
            </button>
        </section>

        <!-- 3. CELEBRATION / RESULT VIEW STATE -->
        <section id="view-result" class="view-section">
            <div class="celebration-box">
                <div class="emoji-banner">🎉 ✨ 🎊</div>
                <h2 class="celebration-title">TODAY IS SO HAPPY FOR YOU</h2>
                
                <div class="status-badge">
                    <i class="fa-solid fa-circle-check"></i>
                    QR Code Scanned Successfully!
                </div>

                <!-- Scanned Data Display Card -->
                <div class="data-preview-card">
                    <div class="data-preview-title">
                        <span>Scanned Content</span>
                        <i class="fa-solid fa-align-left"></i>
                    </div>
                    <div id="scanned-result-text" class="data-content"></div>
                    
                    <div class="data-actions">
                        <button id="btn-copy" class="action-btn-sm">
                            <i class="fa-regular fa-copy"></i> Copy Text
                        </button>
                        <a id="btn-open-link" href="#" target="_blank" rel="noopener noreferrer" class="action-btn-sm" style="display: none;">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open URL
                        </a>
                    </div>
                </div>

                <button id="btn-scan-again" class="btn btn-success">
                    <i class="fa-solid fa-rotate-right"></i>
                    Scan Again
                </button>
            </div>
        </section>

    </main>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-info-circle"></i>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        // DOM Elements Setup
        const viewInitial = document.getElementById('view-initial');
        const viewScanning = document.getElementById('view-scanning');
        const viewResult = document.getElementById('view-result');
        const appSubtitle = document.getElementById('app-subtitle');
        const errorContainer = document.getElementById('error-container');

        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnScanAgain = document.getElementById('btn-scan-again');
        const btnCopy = document.getElementById('btn-copy');
        const btnOpenLink = document.getElementById('btn-open-link');

        const cameraSelectContainer = document.getElementById('camera-select-container');
        const cameraSelect = document.getElementById('camera-select');
        const scannedResultText = document.getElementById('scanned-result-text');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // State Variables
        let html5QrCode = null;
        let isScannerRunning = false;
        let availableCameras = [];
        let currentScannedText = '';

        // Initialize application listeners
        window.addEventListener('DOMContentLoaded', () => {
            btnStart.addEventListener('click', startScannerFlow);
            btnStop.addEventListener('click', stopScannerFlow);
            btnScanAgain.addEventListener('click', resetToInitialState);
            btnCopy.addEventListener('click', copyScannedContent);
            cameraSelect.addEventListener('change', onCameraChange);
        });

        // Switch visible view tab with smooth transition
        function switchView(targetView) {
            [viewInitial, viewScanning, viewResult].forEach(view => {
                view.classList.remove('active');
            });
            clearError();

            setTimeout(() => {
                targetView.classList.add('active');
            }, 50);
        }

        // Display Toast Feedback
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Display inline error cards for missing camera permissions or SSL issues
        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error-card">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <div>
                        <strong>Camera Error</strong>
                        <p style="margin-top: 4px; opacity: 0.9;">${message}</p>
                    </div>
                </div>
            `;
            errorContainer.style.display = 'block';
        }

        function clearError() {
            errorContainer.innerHTML = '';
            errorContainer.style.display = 'none';
        }

        // Check SSL/HTTPS Environment Requirement
        function checkSecureContext() {
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                showError("Camera access requires a secure (HTTPS) connection or localhost context.");
                return false;
            }
            return true;
        }

        // Start Scanner Workflow
        async function startScannerFlow() {
            if (!checkSecureContext()) return;

            switchView(viewScanning);
            appSubtitle.textContent = "Position the QR code inside the frame to scan.";

            try {
                // Instantiation of Html5Qrcode engine
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("qr-reader");
                }

                // Request camera list
                availableCameras = await Html5Qrcode.getCameras();

                if (availableCameras && availableCameras.length > 0) {
                    // Populate camera select box if multiple cameras detected
                    if (availableCameras.length > 1) {
                        cameraSelect.innerHTML = '';
                        availableCameras.forEach((cam, index) => {
                            const option = document.createElement('option');
                            option.value = cam.id;
                            option.textContent = cam.label || `Camera ${index + 1}`;
                            cameraSelect.appendChild(option);
                        });
                        cameraSelectContainer.style.display = 'block';
                    } else {
                        cameraSelectContainer.style.display = 'none';
                    }

                    // Default to back/environment camera if available
                    const backCamera = availableCameras.find(cam => 
                        cam.label.toLowerCase().includes('back') || 
                        cam.label.toLowerCase().includes('rear') ||
                        cam.label.toLowerCase().includes('environment')
                    );

                    const selectedCameraId = backCamera ? backCamera.id : availableCameras[0].id;
                    if (cameraSelectContainer.style.display === 'block') {
                        cameraSelect.value = selectedCameraId;
                    }

                    await startCameraWithId(selectedCameraId);
                } else {
                    showError("No camera hardware detected on your device.");
                    switchView(viewInitial);
                }
            } catch (err) {
                console.error("Camera access error:", err);
                if (err.name === 'NotAllowedError' || err.toString().includes('Permission denied')) {
                    showError("Camera permission was denied. Please allow camera permissions in your browser settings to continue.");
                } else {
                    showError(`Unable to start camera: ${err.message || err}`);
                }
                switchView(viewInitial);
            }
        }

        // Start Scanner engine with a specific Camera ID
        async function startCameraWithId(cameraId) {
            const config = {
                fps: 15,
                qrbox: { width: 220, height: 220 },
                aspectRatio: 1.0
            };

            try {
                await html5QrCode.start(
                    cameraId,
                    config,
                    onQrCodeSuccess,
                    onQrCodeScanFailure
                );
                isScannerRunning = true;
            } catch (err) {
                console.error("Failed to start camera feed:", err);
                showError("Could not start camera video stream.");
                switchView(viewInitial);
            }
        }

        // Camera Dropdown Switch Handler
        async function onCameraChange() {
            if (isScannerRunning && html5QrCode) {
                await html5QrCode.stop();
                isScannerRunning = false;
                await startCameraWithId(cameraSelect.value);
            }
        }

        // Callback when QR code fails to detect on frame (noop to reduce noise)
        function onQrCodeScanFailure(error) {
            // Quiet frame-by-frame scanner attempts
        }

        // Callback on QR Detection
        async function onQrCodeSuccess(decodedText, decodedResult) {
            // Immediately stop camera
            if (isScannerRunning) {
                await stopScannerFlow(false);
            }

            // Save decoded payload
            currentScannedText = decodedText;
            scannedResultText.textContent = decodedText;

            // Detect URL and configure open link button
            if (isValidUrl(decodedText)) {
                btnOpenLink.href = decodedText;
                btnOpenLink.style.display = 'inline-flex';
            } else {
                btnOpenLink.style.display = 'none';
            }

            // Switch view to results & celebrate
            switchView(viewResult);
            appSubtitle.textContent = "Your special QR code message is ready!";
            triggerCelebrationEffects();
        }

        // Stop Camera Feed cleanly
        async function stopScannerFlow(switchToInitial = true) {
            if (html5QrCode && isScannerRunning) {
                try {
                    await html5QrCode.stop();
                    isScannerRunning = false;
                } catch (err) {
                    console.error("Error stopping camera engine:", err);
                }
            }

            if (switchToInitial) {
                switchView(viewInitial);
                appSubtitle.textContent = "Scan the QR code to reveal your special message.";
            }
        }

        // Reset App back to Initial View
        function resetToInitialState() {
            stopScannerFlow(true);
        }

        // Dynamic Celebration Canvas Confetti & Sparkling Particles
        function triggerCelebrationEffects() {
            if (typeof confetti === 'function') {
                // Initial Big Burst
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#f59e0b', '#10b981', '#6366f1', '#ffffff']
                });

                // Secondary Side Cannon Bursts
                setTimeout(() => {
                    confetti({
                        particleCount: 50,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#f59e0b', '#fef08a']
                    });
                    confetti({
                        particleCount: 50,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#10b981', '#6366f1']
                    });
                }, 250);
            }
        }

        // Helper to check for valid URLs
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        // Clipboard Copy functionality with fallback support
        function copyScannedContent() {
            if (!currentScannedText) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentScannedText)
                    .then(() => showToast("Copied to clipboard!"))
                    .catch(() => fallbackCopyText(currentScannedText));
            } else {
                fallbackCopyText(currentScannedText);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast("Copied to clipboard!");
            } catch (err) {
                showToast("Failed to copy content.");
            }
            
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
